<div class="council-error">
  <div class="card error-card">
    <div class="error-icon"><i class="ph-fill ph-x-circle" aria-hidden="true"></i></div>
    <h2>{{ title() }}</h2>
    <p>{{ error() }}</p>
    <button class="btn btn-primary" (click)="onRetry()">{{ buttonText() }}</button>
  </div>
</div>
