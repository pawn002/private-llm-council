<div class="deliberation-view">
  <!-- Question Header -->
  <app-question-header
    [deliberation]="deliberation()"
    (saveClicked)="saveClicked.emit()"
    (newQuestion)="newQuestion.emit()"
  />

  <!-- Tab Navigation -->
  <div class="tabs">
    <button
      class="tab"
      [class.active]="activeTab() === 'synthesis'"
      (click)="setActiveTab('synthesis')"
    >
      Synthesis
    </button>
    <button
      class="tab"
      [class.active]="activeTab() === 'perspectives'"
      (click)="setActiveTab('perspectives')"
    >
      @if (deliberation().failed_members?.length) {
        Perspectives ({{ deliberation().perspectives.length }}/{{ deliberation().perspectives.length + (deliberation().failed_members?.length ?? 0) }})
      } @else {
        Perspectives ({{ deliberation().perspectives.length }})
      }
    </button>
  </div>

  <!-- Tab Content -->
  <div class="tab-content">
    @if (activeTab() === 'synthesis') {
      <app-synthesis-panel
        [synthesis]="deliberation().synthesis"
        [disagreements]="deliberation().disagreements"
        [minorityReports]="deliberation().minority_reports"
      />
    } @else {
      <app-perspectives-list
        [perspectives]="deliberation().perspectives"
        [failedMembers]="deliberation().failed_members ?? []"
      />
    }
  </div>
</div>
