# ============================================================================
# THE SOVEREIGN COUNCIL - Modest Hardware Configuration
# ============================================================================
# Optimized for: 16GB RAM + Integrated GPU (or CPU-only inference)
# Expected performance: 5-15 minute deliberations
# Use case: Laptops, older hardware, contributors testing configurations
# ============================================================================

# To use this configuration:
# 1. Pull the required models:
#    ollama pull llama3.2:1b
#    ollama pull qwen2.5:3b
#    ollama pull llama3.2:3b
#
# 2. (Optional) Force CPU-only mode for better performance on integrated GPUs:
#    export OLLAMA_NUM_GPU=0
#
# 3. Start the backend:
#    CONFIG_PATH=config/sovereign_council_modest.yaml python -m src.main

# ============================================================================
# IDENTITY & VALUES
# ============================================================================
identity:
  name: "The Sovereign Council (Modest Hardware Edition)"
  version: "0.1.0"
  principle: |
    Your deliberations belong to you.
    This system exists to keep them that way.
    You don't need expensive hardware to explore these ideas.

# ============================================================================
# PRIVACY MODE
# ============================================================================
privacy:
  mode: "sanctuary"

  modes:
    sovereign:
      description: "Air-gapped operation. No network activity whatsoever."
      network_check: "fail_if_any_interface_up"
      deployment: "native_binary"

    sanctuary:
      description: "Local network only. Verified isolation from internet."
      network_check: "fail_if_external_egress_possible"
      deployment: "docker_host_network"
      allowed_connections:
        - "localhost"
        - "127.0.0.1"
        - "host.docker.internal"

    citadel:
      description: "Containerized with network policies. Easier deployment."
      network_check: "warn_if_egress_possible"
      deployment: "docker_compose"

# ============================================================================
# INFERENCE GATEWAY
# ============================================================================
gateway:
  provider: "ollama"
  url: "http://localhost:11434/v1"

  # Longer timeout for slower CPU inference
  timeout_seconds: 180

  retry_attempts: 3
  retry_delay_seconds: 2

  health_check:
    enabled: true
    endpoint: "/health"
    interval_seconds: 30

  # Skip warmup to reduce initial memory usage
  warmup:
    enabled: false

# ============================================================================
# COUNCIL COMPOSITION - ULTRA-LIGHT MODELS
# ============================================================================
council:
  members:
    # Minimal 2-member council for modest hardware
    # You can add a third member if you have 20GB+ RAM

    - id: "phi"
      model: "llama3.2:1b"
      capability: "Ultra-light but capable general reasoning"
      character: "Pragmatic, direct, Western analytical tradition"
      temperature: 0.7

    - id: "psi"
      model: "qwen2.5:3b"
      capability: "Efficient multilingual model with diverse training"
      character: "Considers multiple cultural perspectives"
      temperature: 0.7

    # Optional third member (uncomment if you have headroom):
    # - id: "omega"
    #   model: "llama3.2:3b"
    #   capability: "Balanced performance and size"
    #   character: "Cautious, detail-oriented"
    #   temperature: 0.7

  chairman:
    # Use 3B model for synthesis instead of 70B
    model: "llama3.2:3b"
    capability: "Lightweight synthesis, preserves dissent"
    role: "Synthesizer and dissent-preserver, not arbiter of truth"
    temperature: 0.3
    preserve_dissent: true

    fallback:
      enabled: true
      prompt_user: true
      message: "Chairman model unavailable. Use {fallback_model} for synthesis?"

# ============================================================================
# DELIBERATION PROCESS - SEQUENTIAL INFERENCE
# ============================================================================
deliberation:
  stages:
    # Stage 1: Gather independent perspectives
    collect:
      # Sequential inference to reduce memory pressure
      parallel: false
      # Longer timeout for CPU inference
      timeout_per_model_seconds: 120

    # Stage 2: Anonymized peer review
    review:
      anonymize_models: true
      require_rankings: true

    # Stage 3: Chairman synthesis
    synthesize:
      preserve_dissent: true
      include_minority_reports: true

  # Full transparency - user sees everything
  transparency:
    show_individual_responses: true
    show_peer_reviews: true
    highlight_disagreements: true
    show_confidence_levels: true
    include_minority_reports: true

# ============================================================================
# DEGRADATION POLICY
# ============================================================================
degradation:
  silent_fallback: false

  on_model_unavailable:
    action: "prompt_user"
    message: "Council member unavailable. Continue with reduced epistemic diversity?"

  on_chairman_unavailable:
    action: "prompt_user"
    fallback_to_largest_available: true
    message: "Chairman unavailable. Use {fallback_model} for synthesis?"

  # Allow 2-member council for modest hardware
  minimum_council_size: 2
  warn_below_size: 3
  below_minimum_message: "Running with minimal council. Consider adding members when hardware allows."

# ============================================================================
# PERSISTENCE
# ============================================================================
persistence:
  default: "ephemeral"

  operator_can_override: true

  consent_banner:
    always_show_on_session_start: true
    user_dismissable: true
    persist_dismissal: "session_only"
    text: "This deliberation will be forgotten when you close the session."

  save:
    encryption: "required"
    algorithm: "AES-256-GCM"
    key_source: "user_provided"

  forget:
    secure_overwrite: true
    overwrite_passes: 3

# ============================================================================
# TELEMETRY
# ============================================================================
telemetry:
  enabled: false

# ============================================================================
# HARDWARE PROFILE
# ============================================================================
hardware:
  profile: "modest"
  specs:
    ram_gb: 16
    gpu_type: "integrated"  # or "cpu_only"
    description: "Integrated GPU or CPU-only inference with ultra-light models"

  optimization:
    notes: |
      Performance tips for this configuration:

      1. Force CPU-only mode (often faster than integrated GPU):
         export OLLAMA_NUM_GPU=0

      2. Close background applications to free RAM

      3. Monitor temperature - use cooling pad if throttling occurs

      4. Expect 5-15 minute deliberations (this is normal!)

      5. Consider adding third council member if you have 20GB+ RAM

# ============================================================================
# LOGGING
# ============================================================================
logging:
  level: "INFO"

  redact_queries: true
  redact_responses: true

  rotation:
    max_size_mb: 10
    backup_count: 3

  output:
    console: true
    file: "logs/sovereign_council_modest.log"

# ============================================================================
# PERFORMANCE EXPECTATIONS
# ============================================================================
# With this configuration:
# - Model loading: 10-30 seconds each
# - Per-perspective inference: 2-5 minutes
# - Full deliberation (2 members + chairman): 5-15 minutes
# - Memory usage: 6-10GB total
# - CPU usage: 80-100% during inference (normal)
#
# This is slow compared to dedicated GPU configs, but:
# ✓ Completely functional
# ✓ Privacy-preserving
# ✓ No hardware investment required
# ✓ Sufficient for testing and development
# ============================================================================
