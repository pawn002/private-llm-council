<!-- Idle State -->
@if (state().phase === 'idle') {
  <app-question-form
    (submitted)="onQuestionSubmitted($event)"
    (loadClicked)="onLoadClick()"
  />
}

<!-- Loading State -->
@if (isLoading()) {
  <app-loading-state
    [phase]="state().phase"
    [statusMessage]="state().statusMessage"
    [elapsedSeconds]="state().elapsedSeconds"
    [ollamaBusy]="state().ollamaBusy"
    (cancel)="onCancel()"
  />
}

<!-- Error State -->
@if (state().phase === 'error') {
  <app-error-state
    [error]="state().error"
    (retry)="onReset()"
  />
}

<!-- Complete State -->
@if (state().phase === 'complete' && state().deliberation; as deliberation) {
  <app-deliberation-view
    [deliberation]="deliberation"
    (saveClicked)="onSave()"
    (newQuestion)="onReset()"
  />
}

<!-- Save/Load Dialog -->
<app-save-load-dialog
  [mode]="dialogMode() ?? 'save'"
  [isOpen]="dialogMode() !== null"
  [deliberationId]="state().deliberation?.id"
  (close)="closeDialog()"
  (save)="handleSave($event)"
  (load)="handleLoad($event)"
  (forget)="handleForget()"
/>
