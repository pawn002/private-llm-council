<div class="perspective-card" [class]="borderColor()">
  <button class="card-header" (click)="onToggle()">
    <div class="member-info">
      <span class="member-icon">{{ icon() }}</span>
      <div class="member-details">
        <h3>{{ perspective().member_id }}</h3>
        <p>{{ perspective().character }} · {{ perspective().model }}</p>
      </div>
    </div>
    <i [class]="isExpanded() ? 'ph-bold ph-caret-down toggle-icon' : 'ph-bold ph-caret-right toggle-icon'" aria-hidden="true"></i>
  </button>

  @if (isExpanded()) {
    <div class="card-content">
      <div class="perspective-text prose" [innerHTML]="perspective().content | markdown"></div>
      <div class="timestamp">{{ formattedTimestamp() }}</div>
    </div>
  }
</div>
