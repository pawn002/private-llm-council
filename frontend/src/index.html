<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Sovereign Council</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Privacy-first local LLM deliberation">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- No external fonts or analytics - everything runs locally -->
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
